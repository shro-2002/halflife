name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --frozen
      - name: Offline test suite (live tests deselected; no keys needed)
        run: uv run pytest -q
      - name: Case file integrity (quotes found in saved sources)
        run: uv run python eval/build_cases.py --check
      - name: Results regenerate from saved raw data (no spend)
        run: uv run python -m eval.run --offline > /dev/null
      - name: Fair-baseline comparison regenerates from both live runs (no spend)
        run: uv run python -m eval.fair_baseline > /dev/null
